name: Quality

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('manifest.webmanifest')]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid JSON: {path}')
          PY

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f icons/icon.svg

      - name: Basic source safety checks
        run: |
          ! grep -RInE 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}' . --exclude-dir=.git
