name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bundled content (offline, no downloads)
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = 0
          files = list(pathlib.Path("data").rglob("*.json"))
          if not files:
              print("::warning::No JSON files found under data/")
          for p in files:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"::error file={p}::Invalid JSON: {e}")
                  bad += 1
          print(f"Checked {len(files)} JSON files, {bad} invalid")
          sys.exit(1 if bad else 0)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaad-almuslim-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
