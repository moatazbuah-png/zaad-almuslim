name: Android Emulator Smoke Test

on:
  workflow_dispatch:

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Android project
        run: |
          if [ ! -f gradlew ] && [ ! -f build.gradle ] && [ ! -f settings.gradle ]; then
            echo "No native Android/Gradle project found. This repository is currently a web/PWA project."
            exit 1
          fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Pixel_6
          script: ./gradlew connectedCheck