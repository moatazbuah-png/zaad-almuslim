name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web assets
        run: |
          mkdir -p android/app/src/main/assets
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='android/' ./ android/app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Android project
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          gradle -p android :app:tasks --no-daemon

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaad-almuslim-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
