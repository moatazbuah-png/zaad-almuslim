name: Quality

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('data/content.json','utf8')); console.log('JSON valid')"

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f sw.js
          test -f manifest.webmanifest
          test -f icons/icon.svg
          test -f js/integration.js
          test -f js/ui.js
          test -f js/bootstrap.js
          test -f js/content.js
          test -f js/features/quran-data.js
          test -f tests/core.test.js

      - name: Validate JavaScript syntax
        run: find js tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Source safety checks
        run: |
          ! grep -RInE 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}' . --exclude-dir=.git
          ! grep -RInE '<script[^>]+src=.*http://' . --include='*.html' --exclude-dir=.git
          ! grep -RInE 'eval\\(|new Function\\(' js tests --include='*.js'

      - name: Validate application wiring
        run: |
          grep -q 'type="module" src="./js/integration.js"' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q "register('./sw.js'" index.html
          grep -q "CACHE_NAME = 'zaad-almuslim-v6'" sw.js
          ! grep -q "'./script.js'" sw.js

      - name: Run integration tests
        run: node tests/core.test.js
