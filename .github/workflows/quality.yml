name: Quality

on:
  push:
    branches: [main, 'feat/**', 'rebuild/**']
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('manifest.webmanifest'), Path('data/content.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid JSON: {path}')
          PY

      - name: Check required files
        run: |
          test -f index.html
          test -f js/content.js
          test -f js/core/state.js
          test -f js/features/quran.js
          test -f js/features/adhkar.js
          test -f js/features/prayer.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f icons/icon.svg
          test -f data/SOURCES.md

      - name: JavaScript syntax checks
        run: |
          node --check js/content.js
          node --check js/core/state.js
          node --check js/features/quran.js
          node --check js/features/adhkar.js
          node --check js/features/prayer.js

      - name: Application integrity checks
        run: |
          if grep -RIn "showToast('تم تشغيل الاستماع')" index.html js; then exit 1; fi
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}' . --exclude-dir=.git; then exit 1; fi
          grep -q 'data/quran.json' js/content.js
          grep -q 'data/hadith/' js/content.js
          grep -q 'everyayah.com' index.html
          grep -q 'api.aladhan.com' index.html
